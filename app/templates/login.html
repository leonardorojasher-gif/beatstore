{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
  <h1>Ingresar</h1>
  {% if error %}<div class="alerta error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Correo <input type="email" name="email" value="{{ email }}" maxlength="254" autocomplete="username" required></label>
    <label>Contraseña <input type="password" name="password" maxlength="128" autocomplete="current-password" required></label>
    <button class="boton">Ingresar</button>
  </form>
  <p class="nota">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Crear una cuenta</a></p>
  <p class="nota">Por seguridad, la cuenta se bloquea 15 minutos tras 5 intentos fallidos.</p>
</section>
{% endblock %}
